<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Spotify Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="layout">

    <aside class="sidebar">
      <h1 class="logo">Spotify</h1>

      <nav class="menu">
        <a href="#">Início</a>
        <a href="#">Buscar</a>
        <a href="#">Sua Biblioteca</a>
      </nav>

      <div class="playlist-section">
        <h2>PLAYLISTS</h2>
        <a href="#">Favoritas</a>
        <a href="#">Top Hits</a>
        <a href="#">Chill</a>
      </div>
    </aside>

    <main class="main-content">
      <h2>Boa noite</h2>

      <div class="cards">
        <div class="card">
          <img src="https://picsum.photos/200?1">
          <p>Daily Mix</p>
        </div>

        <div class="card">
          <img src="https://picsum.photos/200?2">
          <p>Top Brasil</p>
        </div>

        <div class="card">
          <img src="https://picsum.photos/200?3">
          <p>Lo-fi Beats</p>
        </div>

        <div class="card">
          <img src="https://picsum.photos/200?4">
          <p>Rock Classics</p>
        </div>
      </div>
    </main>

  </div>

  <footer class="player">
    <div class="music-info">
      <img src="https://picsum.photos/50">
      <div>
        <strong>Nome da Música</strong>
        <span>.</span>
      </div>
    </div>

    <div class="controls">▶</div>

    <div class="volume">🔊</div>
  </footer>

</body>
</html>
